<!DOCTYPE html>
<html lang="pt-br" ng-app="promoApp">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistema de Promoções</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="css/styles.css" rel="stylesheet" />
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.3/angular.min.js"></script>
</head>

<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark mb-4 shadow-sm">
    <div class="container">
      <span class="navbar-brand">Sistema de Promoções</span>
    </div>
  </nav>

  <!-- Container principal -->
  <div class="container" ng-controller="AppCtrl as app">

    <!-- Abas -->
    <ul class="nav nav-tabs mb-4">
      <li class="nav-item">
        <a class="nav-link" ng-class="{active: app.aba === 'cliente'}" ng-click="app.aba = 'cliente'">
          Cliente
        </a>
      </li>
      <li class="nav-item">
        <a class="nav-link" ng-class="{active: app.aba === 'loja'}" ng-click="app.aba = 'loja'">
          Loja
        </a>
      </li>
    </ul>

    <!-- Aba: Cliente -->
    <div ng-show="app.aba === 'cliente'">
      <lista-promocoes interesses="app.interesses"></lista-promocoes>
      <hr class="my-4" />
      <gerenciar-interesses client-id="app.clientId" interesses="app.interesses"></gerenciar-interesses>
    </div>

    <div class="alert alert-info" ng-repeat="n in app.notificacoes">
      <strong>{{n.categoria}}</strong>: {{n.mensagem}}
    </div>

    <!-- Aba: Loja -->
    <div ng-show="app.aba === 'loja'">
      <formulario-cadastro></formulario-cadastro>
    </div>

  </div><!-- /container -->

  <script src="js/app.js"></script>
</body>
</html>
